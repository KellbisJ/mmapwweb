<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/index.css" />
    <title>MMapWWeb</title>
  </head>
  <body>
    <main class="mindmap_core">
      <header class="header" style="top: 12px; left: 12px">
        <div class="exportMmapOptions">
          <button id="exportPng" class="btn_header" type="button">Export PNG</button>
          <button id="exportPdf" class="btn_header" type="button">Export PDF</button>

        <div class="nodeOptions">

      </header>

      <div id="dragZone" class="mindmap_nodes"></div>
    </main>

    <script type="module" src="/index.js"></script>
  </body>
